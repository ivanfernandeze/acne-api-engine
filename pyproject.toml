[project]
name = "acne-ai-engine"
version = "0.1.0"
description = "Motor de inferencia CNN y analisis estadistico del prototipo de diagnostico asistido de acne - Tesis UNT 2026"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
    # Runtime HTTP client for the Gemini backend (app/models/gemini_backend.py).
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Real CNN backend. Installed separately because PyTorch wheels are large and platform-specific;
# on the study's RTX 5060 (Blackwell, sm_120) a CUDA 12.8+ build is required:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu128
torch = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "timm>=1.0.11",
    "captum>=0.7.0",
    "facenet-pytorch>=2.6.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.17.0",
    # YOLOv8 (clasificacion y deteccion) y el evaluador COCO comun a ambos detectores. Ultralytics
    # es AGPL-3.0: admisible en el prototipo academico, declarado en 04_modeling.md.
    "ultralytics>=8.3",
    "torchmetrics>=1.4",
    "pycocotools>=2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic.
# Typography of Spanish prose and of statistics, not look-alike identifiers.
allowed-confusables = ["–", "−", "α", "×"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "scipy.*", "PIL.*", "timm.*", "captum.*", "torch.*", "torchvision.*", "sklearn.*", "mlflow.*",
    "ultralytics.*", "torchmetrics.*", "cv2", "cv2.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# Backends that only run with the [torch] extra. CI installs `--extra dev` only, so their tests
# skip there (pytest.importorskip) and they would count as 0 % against the 70 % gate; they are
# tested locally, with the extra, by tests/test_torch_backend.py and tests/test_ensemble_backend.py.
omit = ["app/models/torch_backend.py", "app/models/ensemble_backend.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
